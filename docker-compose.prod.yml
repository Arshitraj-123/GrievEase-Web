services:
  postgres:
    image: postgres:16-alpine
    container_name: grievease-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-grievease_prod}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    networks:
      - grievease-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-grievease_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: grievease-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - grievease-backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: grievease-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    networks:
      - grievease-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: grievease-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-grievease_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_SECRET: ${REFRESH_SECRET}
      ANONYMITY_SECRET_SALT: ${ANONYMITY_SECRET_SALT}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: grievease-uploads
      MINIO_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - grievease-backend
      - grievease-edge

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: grievease-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://api:4000/api/v1
    depends_on:
      - api
    networks:
      - grievease-edge

  nginx:
    image: nginx:1.25-alpine
    container_name: grievease-edge-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/admin-ips.conf:/etc/nginx/admin-ips.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - api
    networks:
      - grievease-edge

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: grievease-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    networks:
      - grievease-backend

  loki:
    image: grafana/loki:3.0.0
    container_name: grievease-loki
    restart: unless-stopped
    volumes:
      - ./deploy/monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - lokidata:/loki
    networks:
      - grievease-backend

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grievease-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./deploy/monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
    networks:
      - grievease-backend
      - grievease-edge

volumes:
  pgdata:
  redisdata:
  miniodata:
  promdata:
  lokidata:
  grafanadata:

networks:
  grievease-backend:
    driver: bridge
    internal: true
  grievease-edge:
    driver: bridge

