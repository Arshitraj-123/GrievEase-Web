# By default, access is permitted to all (0.0.0.0/0).
# To lock /admin and /setup to specific management subnets or VPN IPs,
# uncomment and adapt the lines below:

# allow 127.0.0.1;
# allow 10.0.0.0/8;
# allow 172.16.0.0/12;
# allow 192.168.0.0/16;
# allow 203.0.113.10; # Dedicated Management Office Static IP
# deny all;
