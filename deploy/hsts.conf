# ==============================================================================
# GrievEase HSTS (HTTP Strict Transport Security) Staged Deployment Config
# ==============================================================================
# CAUTION: Enabling HSTS instructs browsers to refuse plain HTTP connections
# unconditionally. Preload submission is permanent and affects all subdomains.
#
# Default: Disabled until production TLS certificates and subdomains are verified.
# Un-comment the appropriate stage according to the deployment schedule:
#
# Stage 1: Initial Smoke Test (5 minutes / 300 seconds)
# add_header Strict-Transport-Security "max-age=300" always;
#
# Stage 2: Verification Period (1 week / 604,800 seconds)
# add_header Strict-Transport-Security "max-age=604800" always;
#
# Stage 3: Operational Stability (1 month / 2,592,000 seconds)
# add_header Strict-Transport-Security "max-age=2592000" always;
#
# Stage 4: Production Standard (1 year / 31,536,000 seconds + subdomains)
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
# Stage 5: Final Preload (Only after all society subdomains are 100% HTTPS-enabled)
# add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

