# PostgreSQL Client Authentication Configuration File (pg_hba.conf)
# GrievEase Self-Hosted Hardened Setup
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
local   all             all                                     scram-sha-256

# IPv4 local connections:
host    all             all             127.0.0.1/32            scram-sha-256

# IPv6 local connections:
host    all             all             ::1/128                 scram-sha-256

# Allow Docker internal network connections only (RFC 1918 subnets for bridge/compose networks)
# Disallows any direct exposure to the public Internet (0.0.0.0/0)
host    grievease_prod  grievease_app       172.16.0.0/12       scram-sha-256
host    grievease_prod  grievease_worker    172.16.0.0/12       scram-sha-256
host    grievease_prod  grievease_backup    172.16.0.0/12       scram-sha-256
host    grievease_prod  grievease_ro        172.16.0.0/12       scram-sha-256
host    grievease_prod  grievease_migrator  172.16.0.0/12       scram-sha-256

# Reject all other incoming connection attempts explicitly
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
