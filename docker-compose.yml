version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: grievease_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-grievease_db}
      POSTGRES_USER: ${DB_USER:-grievease_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_secret_replace_in_prod}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-grievease_user} -d ${DB_NAME:-grievease_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: grievease_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-local_redis_secret_replace_in_prod}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-local_redis_secret_replace_in_prod}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-09-27T15-22-50Z
    container_name: grievease_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-local_minio_secret_replace_in_prod}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional ClamAV Antivirus Scanner (set CLAMAV_ENABLED=true)
  clamav:
    image: clamav/clamav:1.2_base
    container_name: grievease_clamav
    restart: unless-stopped
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    profiles:
      - optional-clamav

volumes:
  postgres_data:
  redis_data:
  minio_data:
