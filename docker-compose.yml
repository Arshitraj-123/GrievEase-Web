version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: grievease_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-grievease_db}
      POSTGRES_USER: ${DB_USER:-grievease_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_secret_replace_in_prod}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-grievease_user} -d ${DB_NAME:-grievease_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: grievease_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-local_redis_secret_replace_in_prod}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-local_redis_secret_replace_in_prod}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
