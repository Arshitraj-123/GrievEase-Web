name: GrievEase Hardened CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Enforce least-privilege workflow token permissions across all jobs
permissions:
  contents: read

jobs:
  security-and-quality:
    name: Lint, Full History Secret Scan & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Full git history for secret scanning

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78d470290c2184ba80f8f42426345b6673 # v4.0.0
        with:
          version: 9

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Working Tree Secret Scan
        run: pnpm secret-scan

      - name: Full Git History Secret Scan (All Commits)
        run: node scripts/git-history-scan.js

      - name: Dead Code and Unused Dependency Gate
        run: node scripts/audit-unused-code.js

      - name: Preflight Checklist Verification
        run: pnpm preflight

      - name: Run Type Check
        run: pnpm type-check

      - name: Run Linter & i18n Guard
        run: pnpm lint

  tests:
    name: Unit & Integration Tests + Restore Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: grievease_db
          POSTGRES_USER: grievease_user
          POSTGRES_PASSWORD: local_dev_secret_replace_in_prod
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78d470290c2184ba80f8f42426345b6673 # v4.0.0
        with:
          version: 9

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Database Migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://grievease_user:local_dev_secret_replace_in_prod@localhost:5432/grievease_db

      - name: Run Unit Tests (162+ security and regression tests)
        run: pnpm test:unit

      - name: Run Integration Tests
        run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://grievease_user:local_dev_secret_replace_in_prod@localhost:5432/grievease_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Test Encrypted Backup & Restore Benchmark
        run: pnpm backup:verify

      - name: Build All Workspaces
        run: pnpm build

      - name: Demo Workflow Verification & Quality Gate
        run: pnpm demo:verify --fast
        env:
          DEMO_MODE: 'true'
          ALLOW_DEMO_SEED_ON_DEV: 'true'

      - name: Demo Pack Assembly & Leak Audit
        run: pnpm demo:pack
        env:
          DEMO_MODE: 'true'
